name: Fork Publish Artifact

# Publishes an already-built artifact as a PUBLIC release asset so it can be
# downloaded anonymously (artifact downloads need auth; releases do not).

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fork-publish.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifact from run 41554637347
        uses: actions/download-artifact@v4
        with:
          name: llama-bin-win-cuda-13.4-x64.zip
          run-id: 41554637347
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Publish as public release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create fork-pin-features-dropin dist/llama-bin-win-cuda-13.4-x64.zip \
            --title "llama.cpp b11803 + features_buf pin patch (fork build, win-cuda 13.4 x64)" \
            --notes "Built from fork master (b11803 base + features_buf pin patch in common/speculative.cpp). Artifact from run 41554637347, windows-cuda 13.4 x64 job. Drop-in over the Llama folder (backup llama-server.exe and llama-server-impl.dll first)." \
            --prerelease
