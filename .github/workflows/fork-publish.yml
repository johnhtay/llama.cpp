name: Fork Publish Artifact

# Publishes an already-built artifact as a PUBLIC release asset so it can be
# downloaded anonymously (artifact downloads need auth; releases do not).
# Steps use continue-on-error; the final step exits with a stage-specific
# code (3 = artifact download failed, 4 = release publish failed) that shows
# up in the public check-run annotations.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fork-publish.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact via gh api
        id: dl
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          # windows-cuda artifacts contain ONLY ggml-cuda.dll (GGML_BACKEND_DL=ON);
          # the patched CPU suite (llama-common.dll etc.) is in the windows-cpu artifact
          gh api repos/johnhtay/llama.cpp/actions/artifacts/13194187919/zip > artifact.zip
          echo "zip bytes: $(stat -c%s artifact.zip)"
          rm -rf dist && mkdir dist
          unzip -q artifact.zip -d dist
          ls -la dist

      - name: Publish release asset
        id: pub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          if [ -f dist/llama-bin-win-cpu-x64.zip ]; then
            ASSET=dist/llama-bin-win-cpu-x64.zip
          elif ls dist/*.exe >/dev/null 2>&1; then
            (cd dist && zip -q -r ../bundle.zip .); ASSET=bundle.zip
          else
            echo "no usable artifact content"; exit 7
          fi
          gh release create fork-pin-features-dropin "$ASSET" \
            --title "llama.cpp b11803 + features_buf pin patch (win-cuda 13.4 x64)" \
            --notes "Built from fork master (b11803 base + features_buf pin patch in common/speculative.cpp). Artifact from run 41554637347, windows-cuda 13.4 x64 job." \
            --prerelease || exit 4

      - name: Stage diagnosis via exit code
        if: always()
        run: |
          if [ "${{ steps.dl.outcome }}" != "success" ]; then
            echo "artifact download failed"; exit 3
          fi
          if [ "${{ steps.pub.outcome }}" != "success" ]; then
            echo "release publish failed"; exit 4
          fi
          echo "publish ok"
